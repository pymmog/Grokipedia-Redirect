<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grokipedia Redirect</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <img
          class="header__icon"
          src="icons/icon48.png"
          width="32"
          height="32"
          alt=""
        />
        <div class="header__text">
          <h1 class="header__title">Grokipedia Redirect</h1>
          <p class="header__subtitle">Wikipedia → Grokipedia</p>
        </div>
      </header>

      <div class="card">
        <span class="card__label" id="enabled-label">Redirect enabled</span>
        <button
          type="button"
          class="switch"
          id="enabled"
          role="switch"
          aria-checked="true"
          aria-labelledby="enabled-label"
        ></button>
      </div>

      <p class="hint">
        Missing Grokipedia articles fall back to Wikipedia.
        <span class="hint__shortcut">
          <span class="hint__shortcut-icon" aria-hidden="true">⌘</span>
          <span>Hold Cmd/Ctrl or Shift to open Wikipedia directly.</span>
        </span>
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
