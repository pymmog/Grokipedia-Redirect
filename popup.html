<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grokipedia Redirect</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 260px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
      }

      p {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.4;
        color: #64748b;
      }

      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #6366f1;
        cursor: pointer;
      }

      .hint {
        margin-top: 12px;
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Grokipedia Redirect</h1>
    <p>Wikipedia article links open in Grokipedia when available.</p>
    <label>
      <span>Redirect enabled</span>
      <input type="checkbox" id="enabled" />
    </label>
    <p class="hint">
      Missing Grokipedia articles fall back to Wikipedia. Hold Cmd/Ctrl or Shift
      to open Wikipedia directly.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
